
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBuddy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #EAF5FF;
    color: #17324D;
}

header {
    background: #174A78;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    flex-wrap: wrap;
}

nav button {
    width: auto;
    padding: 11px 22px;
}

.container {
    max-width: 950px;
    margin: 15px auto;
    padding: 0 18px 30px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #302b5012;
}

input, textarea, select {
    width: 100%;
    padding: 11px;
    margin: 7px 0;
    border: 1px solid #B8D5EE;
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    color: #17324D;
    background: #FBFDFF;
}

input:focus, textarea:focus, select:focus {
    outline: 2px solid #8DBDE5;
    border-color: #5B9ACD;
}

textarea {
    min-height: 140px;
    resize: vertical;
}

button {
    padding: 10px 15px;
    margin: 5px 3px 5px 0;
    background: #174A78;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #10385B;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.secondary {
    background: #DCEEFF;
    color: #174A78;
}

.danger {
    background: #C94F68;
    color: white;
}

.hidden {
    display: none;
}

.progress-bg {
    height: 12px;
    background: #DCEEFF;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #174A78;
    transition: width 0.3s;
}

.timer {
    text-align: center;
    font-size: 55px;
    font-weight: bold;
    margin: 20px 0;
    color: #123B60;
}

.timer-buttons {
    text-align: center;
}

.task-item, .note-item {
    background: #EFF7FF;
    padding: 13px;
    border-radius: 8px;
    margin: 10px 0;
    overflow-wrap: anywhere;
}

.task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.task-item button {
    width: auto;
}

.completed {
    text-decoration: line-through;
    color: #3976A8;
}

.note-item {
    cursor: pointer;
    border: 2px solid transparent;
}

.note-item:hover {
    border-color: #6FA8D8;
}

.note-item.selected {
    border-color: #6FA8D8;
}

#message {
    text-align: center;
    color: #174A78;
    min-height: 22px;
}

.notes-layout {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 18px;
}

@media (max-width: 650px) {
    .notes-layout {
        grid-template-columns: 1fr;
    }

    .timer {
        font-size: 45px;
    }

    .task-item {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <h1>StudyBuddy!</h1>
    <p>lets focus and grow ✨</p>
</header>

<nav>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('notes')">Study Notes</button>
</nav>

<main class="container">

    <div id="message"></div>

    <!-- Dashboard -->
    <section id="dashboard">

        <div class="card">
            <h2>Study Progress</h2>
            <p id="progressText">let's get stuff done!</p>

            <div class="progress-bg">
                <div id="progressBar"></div>
            </div>
        </div>

        <div class="card">
            <h2>🍅 Pomodoro Timer</h2>

            <div class="timer" id="timer">25:00</div>

            <div class="timer-buttons">
                <button onclick="startTimer()">▶ Start</button>
                <button class="secondary" onclick="pauseTimer()">⏸ Pause</button>
                <button class="secondary" onclick="resetTimer()">↻ Reset</button>
            </div>

            <p style="text-align:center" id="timerMessage">
                you got this! start a session
            </p>
        </div>

        <div class="card">
            <h2>My Study Tasks</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="enter a study task..."
            >

            <button onclick="addTask()">Add Task</button>

            <div id="taskList"></div>
        </div>

    </section>

    <!-- Study Notes -->
    <section id="notes" class="hidden">

        <div class="card">
            <h2>My Study Notes</h2>

            <div class="notes-layout">

                <div>
                    <input
                        id="searchInput"
                        placeholder="search notes..."
                        oninput="renderNotes()"
                    >

                    <button onclick="clearEditor()">➕ New Note</button>

                    <div id="noteList"></div>
                </div>

                <div>
                    <label>Note Title</label>
                    <input
                        id="noteTitle"
                        placeholder="enter note title..."
                    >

                    <label>Subject</label>
                    <select id="noteSubject">
                        <option value="">Choose a subject</option>
                        <option>Mathematics</option>
                        <option>Science</option>
                        <option>Computer Science</option>
                        <option>English</option>
                        <option>History</option>
                        <option>Geography</option>
                        <option>Other</option>
                    </select>

                    <label>Note Content</label>
                    <textarea
                        id="noteContent"
                        placeholder="start writing your study notes here..."
                    ></textarea>

                    <button onclick="saveNote()">Save Note</button>
                    <button onclick="updateNote()">Update Note</button>
                    <button class="danger" onclick="deleteNote()">Delete Note</button>
                    <button class="secondary" onclick="clearEditor()">Clear</button>

                    <p id="noteStatus">ready to write a new note!</p>
                </div>

            </div>
        </div>

    </section>

</main>

<script>

// SAVED DATA

let tasks = JSON.parse(localStorage.getItem("studyTasks")) || [];
let notes = JSON.parse(localStorage.getItem("studyNotes")) || [];

let selectedNoteId = null;

function saveData() {
    localStorage.setItem("studyTasks", JSON.stringify(tasks));
    localStorage.setItem("studyNotes", JSON.stringify(notes));
}

function showMessage(message) {
    document.getElementById("message").textContent = message;

    setTimeout(() => {
        document.getElementById("message").textContent = "";
    }, 3000);
}

// PAGE NAVIGATION

function showPage(page) {
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("notes").classList.add("hidden");

    document.getElementById(page).classList.remove("hidden");

    if (page === "notes") {
        renderNotes();
    }
}

// TASK MANAGEMENT

function addTask() {
    const input = document.getElementById("taskInput");
    const title = input.value.trim();

    if (!title) {
        showMessage("Please enter a task first!");
        return;
    }

    tasks.push({
        id: Date.now(),
        title: title,
        completed: false
    });

    input.value = "";
    saveData();
    renderTasks();
}

function toggleTask(id) {
    const task = tasks.find(task => task.id === id);

    if (task) {
        task.completed = !task.completed;
        saveData();
        renderTasks();
    }
}

function removeTask(id) {
    tasks = tasks.filter(task => task.id !== id);

    saveData();
    renderTasks();
}

function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach(task => {
        const item = document.createElement("div");
        item.className = "task-item";

        const title = document.createElement("span");
        title.textContent = (task.completed ? "✅ " : "⬜ ") + task.title;

        if (task.completed) {
            title.classList.add("completed");
        }

        const actions = document.createElement("div");

        const completeButton = document.createElement("button");
        completeButton.textContent = task.completed ? "Undo" : "Complete";
        completeButton.onclick = () => toggleTask(task.id);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "danger";
        deleteButton.onclick = () => removeTask(task.id);

        actions.append(completeButton, deleteButton);
        item.append(title, actions);
        list.appendChild(item);
    });

    const completed = tasks.filter(task => task.completed).length;

    const percentage = tasks.length
        ? Math.round(completed / tasks.length * 100)
        : 0;

    document.getElementById("progressText").textContent =
        `Progress: ${completed} / ${tasks.length} tasks completed (${percentage}%) 🎯`;

    document.getElementById("progressBar").style.width =
        percentage + "%";
}

document.getElementById("taskInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
        addTask();
    }
});

// POMODORO TIMER

let timeLeft = 25 * 60;
let timerInterval = null;

function displayTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}

function startTimer() {
    if (timerInterval !== null) return;

    if (timeLeft <= 0) {
        resetTimer();
    }

    document.getElementById("timerMessage").textContent =
        "let's get stuff done!";

    timerInterval = setInterval(() => {
        timeLeft--;
        displayTimer();

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;

            document.getElementById("timerMessage").textContent =
                "🎉 Pomodoro session complete! Take a break.";
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;

    document.getElementById("timerMessage").textContent =
        "Timer paused.";
}

function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;

    timeLeft = 25 * 60;
    displayTimer();

    document.getElementById("timerMessage").textContent =
        "Timer reset. Ready for another session!";
}

// STUDY NOTES

function saveNote() {
    const title = document.getElementById("noteTitle").value.trim();
    const subject = document.getElementById("noteSubject").value.trim();
    const content = document.getElementById("noteContent").value.trim();

    if (!title || !subject || !content) {
        showMessage("Please fill in the title, subject and content!");
        return;
    }

    notes.push({
        id: Date.now(),
        title,
        subject,
        content,
        updatedAt: new Date().toLocaleString()
    });

    saveData();
    clearEditor();
    renderNotes();

    document.getElementById("noteStatus").textContent =
        "✅ Note saved successfully!";
}

function renderNotes() {
    const list = document.getElementById("noteList");
    const search = document.getElementById("searchInput").value.toLowerCase();

    list.innerHTML = "";

    const filteredNotes = notes.filter(note =>
        note.title.toLowerCase().includes(search) ||
        note.subject.toLowerCase().includes(search) ||
        note.content.toLowerCase().includes(search)
    );

    if (filteredNotes.length === 0) {
        list.textContent = "No notes found.";
        return;
    }

    filteredNotes.forEach(note => {
        const item = document.createElement("div");
        item.className = "note-item";

        if (note.id === selectedNoteId) {
            item.classList.add("selected");
        }

        const title = document.createElement("strong");
        title.textContent = "📘 " + note.title;

        const subject = document.createElement("p");
        subject.textContent = note.subject;

        const date = document.createElement("small");
        date.textContent = "Last updated: " + note.updatedAt;

        item.append(title, subject, date);
        item.onclick = () => selectNote(note.id);

        list.appendChild(item);
    });
}

function selectNote(id) {
    const note = notes.find(note => note.id === id);

    if (!note) return;

    selectedNoteId = id;

    document.getElementById("noteTitle").value = note.title;
    document.getElementById("noteSubject").value = note.subject;
    document.getElementById("noteContent").value = note.content;

    document.getElementById("noteStatus").textContent =
        "Last updated: " + note.updatedAt;

    renderNotes();
}

function updateNote() {
    if (selectedNoteId === null) {
        showMessage("Please select a note to update!");
        return;
    }

    const title = document.getElementById("noteTitle").value.trim();
    const subject = document.getElementById("noteSubject").value.trim();
    const content = document.getElementById("noteContent").value.trim();

    if (!title || !subject || !content) {
        showMessage("Please fill in all fields!");
        return;
    }

    const note = notes.find(note => note.id === selectedNoteId);

    if (!note) return;

    note.title = title;
    note.subject = subject;
    note.content = content;
    note.updatedAt = new Date().toLocaleString();

    saveData();
    renderNotes();

    document.getElementById("noteStatus").textContent =
        "✅ Note updated successfully!";
}

function deleteNote() {
    if (selectedNoteId === null) {
        showMessage("Please select a note to delete!");
        return;
    }

    if (!confirm("Are you sure you want to delete this note?")) {
        return;
    }

    notes = notes.filter(note => note.id !== selectedNoteId);

    saveData();
    clearEditor();
    renderNotes();

    document.getElementById("noteStatus").textContent =
        "🗑 Note deleted.";
}

function clearEditor() {
    selectedNoteId = null;

    document.getElementById("noteTitle").value = "";
    document.getElementById("noteSubject").value = "";
    document.getElementById("noteContent").value = "";

    document.getElementById("noteStatus").textContent =
        "Ready to write a new note!";

    renderNotes();
}

// LOAD SAVED DATA

renderTasks();
renderNotes();
displayTimer();

</script>

</body>
</html>
